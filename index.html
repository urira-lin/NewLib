动力，淀区正常水位保持在 6.5~7.0 米；实施退耕还淀，增加湿地面积，淀区逐步恢复至 360 平方公里左右。","match":"任务对应：多方向、多水源补淀，年入淀水量评价水量保障。"}],"对外":[]}},{"row":28,"dimension":"绿色生态","indicator":"白洋淀综合物种指数","selectedDirections":["对上","对内","对外"],"evidence":{"对上":[{"source":"中央城市工作会议：建立健全科学的城市发展评价体系","quote":"提升城市生物多样性。","match":"任务对应：生物多样性保护；综合物种指数衡量物种状况。"},{"source":"河北雄安新区规划纲要，实施白洋淀生态修复","quote":"实施生态过程调控，恢复退化区域的原生水生植被，促进水生动物土著种增殖和种类增加，恢复和保护鸟类栖息地，提高生物多样性，优化生态系统结构， 增强白洋淀生态自我修复能力。","match":"任务对应：白洋淀土著物种增殖、种类增加及生物多样性，综合物种指数评价物种状况。"}],"对下":[],"对内":[{"source":"高标准高质量建设现代化城市重点任务清单（报审材料），任务91","quote":"推进淀区生态环境修复，加强生物多样性保护。","match":"任务对应：生物多样性保护；综合物种指数衡量物种状况。"},{"source":"河北雄安新区绿色空间专项规划","quote":"尊重自然、顺应自然、保护自然,构建宁静、和谐、美丽的自然环境,充分考虑新区生物多样性,开展健康生境的保护和修复,更好地发挥绿色空间的生态、景观、游憩多元复合功能。","match":"任务对应：生物多样性保护；综合物种指数衡量物种状况。"},{"source":"河北雄安新区规划纲要，实施白洋淀生态修复","quote":"实施生态过程调控，恢复退化区域的原生水生植被，促进水生动物土著种增殖和种类增加，恢复和保护鸟类栖息地，提高生物多样性，优化生态系统结构， 增强白洋淀生态自我修复能力。","match":"任务对应：白洋淀生境修复及物种保护，综合物种指数评价实施成效。"}],"对外":[{"source":"ISO 37120","quote":"主题：环境\n类型：核心\n指标：本土物种数量变化百分比","match":"口径对应：本土物种数量变化与综合物种指数对应物种状况，数量变化率和综合指数不同。"},{"source":"联合国可持续发展目标（SDG）","quote":"目标：保护、恢复和促进可持续利用陆地生态系统，可持续管理森林，防治荒漠化，制止和扭转土地退化，遏制生物多样性的丧失\n具体目标：保护生物多样性和自然栖息地\n指标：物种灭绝风险","match":"具体目标对应：生物多样性及自然栖息地保护；综合物种指数衡量物种状况。"}]}},{"row":29,"dimension":"绿色生态","indicator":"建成区绿化覆盖率（%）","selectedDirections":["对内"],"evidence":{"对上":[],"对下":[],"对内":[{"source":"河北雄安新区绿色空间专项规划","quote":"起步区绿化覆盖率不低于50%。","match":"口径对应：绿化覆盖率；原文限定起步区，确定版名称为建成区。"},{"source":"河北雄安新区规划纲要","quote":"构建由大型郊野生态公园、大型综合公园及社区公园组成的宜人便民公园体系，实现森林环城、湿地入城，3 公里进森林，1 公里进林带，300 米进公园，街道 100%林荫化，绿化覆盖率达到 50%。","match":"任务对应：城市植绿及绿化覆盖率。"},{"source":"河北雄安新区总体规划（2018—2035年）","quote":"结合起步区生态本底，构建由大型郊野生态公园、大型综合公园及社区公园组成的宜人便民公园体系，实现森林环城、湿地入城，3 公里进森林，1 公里进林带，300 米进公园，绿化覆盖率达到 50%。","match":"口径对应：绿化覆盖率；原文限定起步区，确定版名称为建成区。"}],"对外":[]}},{"row":30,"dimension":"绿色生态","indicator":"起步区人均城市公园绿地面积（平方米）","selectedDirections":["对内","对外"],"evidence":{"对上":[],"对下":[],"对内":[{"source":"河北雄安新区绿色空间专项规划","quote":"规划起步区建设优质共享均好的城市公园绿地体系,包括综合公园、专类公园、社区公园与游园,其中,大型综合公园服务半径覆盖各组团,社区公园500米服务半径全覆盖,游园遍布邻里和街坊生活共享圈,共同达到人均城市公园绿地面积20 平方米,公园绿地300米服务半径覆盖率100% (详见附表四)。","match":"直接指标：起步区人均城市公园绿地面积。"}],"对外":[{"source":"城市繁荣指数（CPI）","quote":"维度：生活质量\n子维度：公共空间\n指标：人均绿地面积","match":"指标对应：人均绿地面积；本指标限定起步区城市公园绿地。"},{"source":"ISO 37120","quote":"主题：城市农业和食品安全\n类型：核心\n指标：每10万人口绿地面积（公顷）","match":"口径对应：每10万人口绿地面积与人均公园绿地面积，绿地范围与人口计量单位不同。"},{"source":"联合国可持续发展目标（SDG）","quote":"目标：建设包容、安全、有抵御灾害能力和可持续的城市和人类住区\n具体目标：提供安全、包容的绿色和公共空间\n指标：城市开放空间","match":"具体目标对应：提供绿色和公共空间，以人均公园绿地面积衡量供给。"}]}},{"row":31,"dimension":"绿色生态","indicator":"污水资源化再生利用率（%）","selectedDirections":["对内","对外"],"evidence":{"对上":[],"对下":[],"对内":[{"source":"高标准高质量建设现代化城市重点任务清单（报审材料），任务95","quote":"加快补齐城镇污水收集处理设施短板，推进城镇污水管网全覆盖。建设污水处理绿色低碳标杆厂，完善农村生活污水处理设施，污水、污泥实现无害化处置和资源化再利用。","match":"任务对应：污水处理及再生利用。"},{"source":"高标准高质量推进雄安新区建设现代化城市“十五五”规划纲要（讨论稿），第二十六章 持续打造优美生态环境","quote":"建设污水处理绿色低碳标杆厂，推动污水、污泥实现无害化处置和资源化利用。","match":"任务对应：污水处理及再生利用。"},{"source":"高标准高质量推进雄安新区建设现代化城市“十五五”规划纲要（讨论稿），第八章 率先探索更高质量、更有效率、更加公平、更可持续发展的改革路径","quote":"全面提升再生水资源综合利用水平，打造全国再生水利用重点示范城市。","match":"直接对应：再生水资源综合利用。"},{"source":"河北雄安新区规划纲要","quote":"统筹考虑污水收集处理和再生利用的便捷性、经济性，建设适度分散的设施。","match":"任务对应：污水处理及再生利用。"},{"source":"河北雄安新区总体规划（2018—2035年）","quote":"统筹考虑污水收集处理和再生利用的便捷性、经济性，建设适度分散的设施，污水收集处理率和污水资源化再生利用率不低于 99%。","match":"直接对应：污水资源化再生利用率。"}],"对外":[{"source":"联合国可持续发展目标（SDG）","quote":"目标：为所有人提供水和环境卫生并对其进行可持续管理\n具体目标：改善水质、废水处理和安全再利用\n指标：废水安全处理","match":"具体目标对应：废水处理和安全再利用；本指标衡量再生利用率。"}]}},{"row":32,"dimension":"绿色生态","indicator":"生活垃圾无害化处理率（%）","selectedDirections":["对内","对外"],"evidence":{"对上":[],"对下":[],"对内":[{"source":"高标准高质量建设现代化城市重点任务清单（报审材料），任务96","quote":"强化生活垃圾分类示范和建筑垃圾全过程管理，建立完善覆盖城镇、农村的全域生活垃圾收运处置和执法监管体系，深入推进“无废城市”建设。","match":"任务对应：生活垃圾分类处置、无害化处理及“无废城市”建设。"},{"source":"河北雄安新区规划纲要","quote":"按照减量化、资源化、无害化的要求，全面实施垃圾源头分类减量、分类运输、分类中转、分类处置，建设兼具垃圾分类与再生资源回收功能的交投点、中转站、终端处理设施、生态环境园，最终实现原生垃圾零填埋，生活垃圾无害化处理率达到 100%，城市生活垃圾回收资源利用率达到 45%以上。","match":"任务对应：生活垃圾分类处置、无害化处理及“无废城市”建设。"},{"source":"河北雄安新区总体规划（2018—2035年）","quot <script>

'use strict';
const seed=JSON.parse(document.getElementById('dataset').textContent);
const master=JSON.parse(document.getElementById('master-dataset').textContent);
const masterByRow=new Map(master.map(item=>[item.row,item]));
const directions=['对上','对下','对内','对外'];
const descriptions=['领导人关切与国家政策','居民感受与社会调查','雄安工作指引与部门协作','国际指标与SDG目标'];
const dimensions=[...new Set(master.map(item=>item.dimension))];
const $=id=>document.getElementById(id);
const node=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};
const dirClass=d=>'dir-'+directions.indexOf(d),dimClass=d=>'dim-'+dimensions.indexOf(d);
const initialDirections=r=>directions.filter(d=>r.evidence?.[d]?.length);
const normalize=r=>({...r,selectedDirections:Array.isArray(r.selectedDirections)?directions.filter(d=>r.selectedDirections.includes(d)):initialDirections(r),evidence:r.evidence||Object.fromEntries(directions.map(d=>[d,[]]))});
const signature=JSON.stringify(seed.map(r=>[r.row,r.dimension,r.selectedDirections||initialDirections(r),r.comment||'']));
let hash=2166136261;for(const char of signature){hash^=char.charCodeAt(0);hash=Math.imul(hash,16777619)}
const storageKey='xiongan-city-matrix-'+(hash>>>0).toString(16);
let rows=seed.map(normalize);
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(Array.isArray(saved)&&new Set(saved.map(r=>r.row)).size===saved.length&&saved.every(r=>masterByRow.has(r.row)&&dimensions.includes(r.dimension)&&Array.isArray(r.selectedDirections)&&r.selectedDirections.every(d=>directions.includes(d))))rows=saved.map(normalize)}catch{}
const state={direction:'对上',dimension:'全部维度',query:'',view:'direction'};
let mode='add',chosenRow=null;
const templateHtml='<!doctype html>\n'+document.documentElement.outerHTML;
const has=(r,d)=>r.selectedDirections.includes(d),count=d=>rows.filter(r=>has(r,d)).length;
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(rows));$('save-status').textContent=''}catch{$('save-status').textContent='此浏览器未保存更改，请下载当前HTML留存。'}}
function evidenceItems(r,d){return has(r,d)?(r.evidence[d]||[]):[]}
function evidenceText(r,d,part){if(!has(r,d))return '—';const items=evidenceItems(r,d);if(!items.length)return '依据待核实';return items.map((e,i)=>'（'+(i+1)+'）'+(part?e[part]:[e.source,e.quote,e.match].filter(Boolean).join(' / '))).join('\n')}
function evidencePartCell(r,d,part){const td=node('td',undefined,'direction-evidence '+dirClass(d));if(!has(r,d)){td.textContent='—';return td}const items=evidenceItems(r,d);if(!items.length){td.append(node('span','依据待核实','pending-source'));return td}items.forEach((e,i)=>{const p=node('div',undefined,'evidence');p.append(node('span',(items.length>1?'（'+(i+1)+'）':'')+(e[part]||'—'),part==='source'?'source-name':'plain-evidence'));td.append(p)});return td}
function evidenceCell(r,d){const td=node('td',undefined,'direction-evidence '+dirClass(d));if(!has(r,d)){td.textContent='—';return td}const items=evidenceItems(r,d);if(!items.length){td.append(node('span','依据待核实','pending-source'));return td}items.forEach((e,i)=>{const block=node('div',undefined,'evidence');block.append(node('span',(items.length>1?'（'+(i+1)+'）':'')+e.source,'source-name'),node('span',e.quote,'plain-evidence'),node('span',e.match,'match-evidence'));td.append(block)});return td}
function renderCards(){const host=$('cards');host.replaceChildren();directions.forEach((d,i)=>{const b=node('button',undefined,'card '+dirClass(d)+(state.view==='direction'&&state.direction===d?' active':''));b.type='button';b.setAttribute('aria-label',d+'，'+count(d)+'项');b.append(node('strong',d+' '+count(d)),node('small',descriptions[i]));b.onclick=()=>{state.direction=d;state.view='direction';render();$('explore').scrollIntoView({behavior:'smooth'})};host.append(b)})}
function filtered(){const q=state.query.trim().toLocaleLowerCase();return rows.filter(r=>{if(state.dimension!=='全部维度'&&r.dimension!==state.dimension)return false;if(state.view==='direction'&&!has(r,state.direction))return false;if(!q)return true;return [r.indicator,r.dimension,r.comment||'','D'+r.row,...directions.filter(d=>has(r,d)).flatMap(d=>(r.evidence[d]||[]).flatMap(e=>[e.source,e.quote,e.match]))].join(' ').toLocaleLowerCase().includes(q)})}
function renderComment(action,r){const old=action.querySelector('.comment-text,.comment-toggle');if(old)old.remove();const oldToggle=action.querySelector('.comment-toggle');if(oldToggle)oldToggle.remove();if(!r.comment?.trim())return;const comment=node('div',r.comment,'comment-text collapsed'),toggle=node('button','展开批注','comment-toggle');toggle.type='button';toggle.setAttribute('aria-expanded','false');toggle.onclick=()=>{const expanded=comment.classList.toggle('collapsed')===false;toggle.textContent=expanded?'折叠批注':'展开批注';toggle.setAttribute('aria-expanded',String(expanded))};action.append(comment,toggle);requestAnimationFrame(()=>{if(comment.scrollHeight<=comment.clientHeight+2)toggle.hidden=true})}
function editComment(action,r){const prior=action.querySelector('.comment-editor');if(prior){prior.remove();return}const wrap=node('div',undefined,'comment-editor'),input=node('textarea'),buttons=node('div',undefined,'row-actions'),save=node('button','保存批注'),cancel=node('button','取消');input.value=r.comment||'';input.placeholder='输入对该指标的批注';input.setAttribute('aria-label','批注 '+r.indicator);save.type=cancel.type='button';save.onclick=()=>{r.comment=input.value.trim();persist();wrap.remove();renderComment(action,r)};cancel.onclick=()=>wrap.remove();buttons.append(save,cancel);wrap.append(input,buttons);action.append(wrap);input.focus()}
function renderTable(found){const table=node('table',undefined,'results '+(state.view==='direction'?'direction-table':'matrix-table')),head=node('thead'),hr=node('tr');const cols=state.view==='direction'?['维度','指标','来源体系','原文内容','编辑']:['维度','指标',...directions,'编辑'];cols.forEach((x,i)=>hr.append(node('th',x,state.view==='matrix'&&i>=2&&i<6?('direction-head '+dirClass(x)):'')));head.append(hr);table.append(head);const body=node('tbody');found.forEach(r=>{const tr=node('tr'),dim=node('td');dim.append(node('span',r.dimension,'dim-pill '+dimClass(r.dimension)));tr.append(dim,node('td',r.indicator,'indicator'));if(state.view==='direction')tr.append(evidencePartCell(r,state.direction,'source'),evidencePartCell(r,state.direction,'quote'));else directions.forEach(d=>tr.append(evidenceCell(r,d)));const action=node('td',undefined,'action-cell'),group=node('div',undefined,'row-actions'),edit=node('button','编辑'),commentButton=node('button','批注'),remove=node('button','删除','delete');edit.type=commentButton.type=remove.type='button';edit.setAttribute('aria-label','编辑 '+r.indicator);commentButton.setAttribute('aria-label','批注 '+r.indicator);remove.setAttribute('aria-label','删除 '+r.indicator);edit.onclick=()=>openEdit(r.row);commentButton.onclick=()=>editComment(action,r);remove.onclick=()=>deleteRow(r.row);group.append(edit,commentButton,remove);action.append(group);renderComment(action,r);tr.append(action);body.append(tr)});table.append(body);const host=$('results');host.replaceChildren(table);if(!found.length)host.append(node('div','没有符合条件的指标。','empty'))}
function render(){renderCards();$('dimension').value=state.dimension;$('search').value=state.query;$('direction-view').setAttribute('aria-pressed',String(state.view==='direction'));$('matrix-view').setAttribute('aria-pressed',String(state.view==='matrix'));const found=filtered();$('resultline').textContent=(state.view==='direction'?state.direction+' · '+count(state.direction)+'项':'四向完整矩阵 · '+rows.length+'项')+'；当前显示 '+found.length+' 项';$('summary').replaceChildren(node('span',rows.length+' 项指标'),node('span',dimensions.length+' 个原有维度'),node('span',master.length+' 项候选池'));renderTable(found)}
function renderCandidateList(resetScroll=false){const q=$('candidate-search').value.trim().toLocaleLowerCase();const matches=master.filter(m=>[m.indicator,m.dimension,m.subdimension,'D'+m.row].join(' ').toLocaleLowerCase().includes(q));$('candidate-count').textContent='显示 '+matches.length+' / '+master.length+' 项；已入矩阵的指标可直接编辑';const host=$('candidate-list'),scroll=resetScroll?0:host.scrollTop;host.replaceChildren();matches.forEach(m=>{const existing=rows.some(r=>r.row===m.row),b=node('button',undefined,'candidate-button'+(chosenRow===m.row?' chosen':''));b.type='button';b.append(node('span','D'+m.row+' · '+m.indicator,'line'),node('span',m.dimension+' / '+m.subdimension+(existing?(rows.find(r=>r.row===m.row).selectedDirections.length?' · 已在矩阵中，点击编辑':' · 暂未归类，点击设置方向'):' · 可添加'),'detail'+(existing?' already':'')));b.onclick=()=>{chosenRow=m.row;renderCandidateList();renderEditor()};host.append(b)});host.scrollTop=scroll}
function renderEditor(){const host=$('editor');host.replaceChildren();if(chosenRow===null){host.append(node('p','从左侧的96项总表中选择一项，再设置维度和方向。','editor-placeholder'));return}const item=masterByRow.get(chosenRow),current=rows.find(r=>r.row===chosenRow),active=current?.selectedDirections||[],heading=node('h3',item.indicator),line=node('div','D'+item.row+' · '+item.subdimension,'record-line');host.append(heading,line);const details=node('div',undefined,'metric-details');[['阈值类型',item.thresholdType],['2030年阈值',item.target2030],['获取方式',item.collection]].forEach(([label,value])=>details.append(node('div',label+'：'+(value===null||value===undefined||value===''?'—':String(value)))));host.append(details);const dimLabel=node('label','所属维度','select-label'),select=node('select');select.id='edit-dimension';dimensions.forEach(dim=>{const option=node('option',dim);option.value=dim;select.append(option)});select.value=current?.dimension||item.dimension;dimLabel.append(select);host.append(dimLabel);const field=node('fieldset',undefined,'checklist'),legend=node('legend','所属方向');field.append(legend);directions.forEach(d=>{const label=node('label'),check=node('input');check.type='checkbox';check.value=d;check.checked=active.includes(d);label.append(check,node('span',d+' · '+descriptions[directions.indexOf(d)]));field.append(label)});host.append(field);host.append(node('p','新增方向如无原有依据，将标记为“依据待核实”。','record-line'));const error=node('div',undefined,'form-error');error.id='form-error';error.setAttribute('aria-live','polite');host.append(error);const success=node('div',undefined,'form-success');success.id='form-success';success.setAttribute('aria-live','polite');host.append(success);const actions=node('div',undefined,'editor-actions'),save=node('button',current?'保存修改':'添加到矩阵','save'),cancel=node('button','取消');save.type=cancel.type='button';save.onclick=saveSelection;cancel.onclick=()=>{if(mode==='edit')closeDialog();else{chosenRow=null;renderCandidateList();renderEditor()}};actions.append(save,cancel);if(current){const remove=node('button','从矩阵删除','danger');remove.type='button';remove.onclick=()=>deleteRow(current.row);actions.append(remove)}host.append(actions)}
function openAdd(){mode='add';chosenRow=null;$('dialog-title').textContent='添加指标';$('dialog-body').classList.remove('edit-mode');$('candidate-search').value='';renderCandidateList(true);renderEditor();$('indicator-dialog').showModal();$('candidate-search').focus()}
function openEdit(row){mode='edit';chosenRow=row;$('dialog-title').textContent='编辑指标';$('dialog-body').classList.add('edit-mode');renderEditor();if(!$('indicator-dialog').open)$('indicator-dialog').showModal();$('edit-dimension').focus()}
function closeDialog(){$('indicator-dialog').close();chosenRow=null}
function saveSelection(){const item=masterByRow.get(chosenRow),selection=[...$('editor').querySelectorAll('fieldset input:checked')].map(c=>c.value);const dim=$('edit-dimension').value;if(!dimensions.includes(dim))return;const existing=rows.find(r=>r.row===chosenRow);if(existing){existing.dimension=dim;existing.selectedDirections=selection}else{rows.push({row:item.row,dimension:dim,indicator:item.indicator,evidence:structuredClone(item.evidence||Object.fromEntries(directions.map(d=>[d,[]]))),selectedDirections:selection});rows.sort((a,b)=>a.row-b.row)}persist();render();renderCandidateList();renderEditor();$('form-success').textContent=existing?'已保存修改。':'已添加到矩阵。'}
function deleteRow(row){const item=masterByRow.get(row);if(!window.confirm('从当前矩阵删除“'+item.indicator+'”？之后仍可从96项总表重新添加。'))return;rows=rows.filter(r=>r.row!==row);persist();render();if($('indicator-dialog').open){renderCandidateList();renderEditor();$('form-success').textContent='已从矩阵删除，可重新设置后添加。'}}
function exportCsv(){const found=filtered(),heads=state.view==='direction'?['维度','指标','来源体系','原文内容','批注']:['维度','指标',...directions,'批注'];const table=[heads,...found.map(r=>{const base=[r.dimension,r.indicator];return state.view==='direction'?[...base,evidenceText(r,state.direction,'source'),evidenceText(r,state.direction,'quote'),r.comment||'']:[...base,...directions.map(d=>evidenceText(r,d)),r.comment||'']})];const csv='\ufeff'+table.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');download(csv,'雄安新区四向来源矩阵.csv','text/csv;charset=utf-8')}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=node('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function saveHtml(){const payload=JSON.stringify(rows).replace(/</g,'\\u003c');const output=templateHtml.replace(/(<script id="dataset" type="application\/json">)[\s\S]*?(<\/script>)/,(_,open,close)=>open+payload+close);download(output,'雄安新区城市评价指标交互矩阵_1.2_当前版.html','text/html;charset=utf-8');$('save-status').textContent='已下载包含当前指标、方向和批注的HTML。'}
$('dimension').append(node('option','全部维度'));dimensions.forEach(d=>{const option=node('option',d);option.value=d;$('dimension').append(option)});
$('dimension').onchange=e=>{state.dimension=e.target.value;render()};$('search').oninput=e=>{state.query=e.target.value;render()};$('direction-view').onclick=()=>{state.view='direction';render()};$('matrix-view').onclick=()=>{state.view='matrix';render()};$('reset').onclick=()=>{state.dimension='全部维度';state.query='';render()};$('export').onclick=exportCsv;$('save-html').onclick=saveHtml;
$('add-indicator').onclick=openAdd;$('close-dialog').onclick=closeDialog;$('candidate-search').oninput=()=>renderCandidateList(true);
$('indicator-dialog').addEventListener('click',event=>{const dialog=$('indicator-dialog');if(event.target!==dialog)return;const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog()});
$('indicator-dialog').addEventListener('close',()=>{chosenRow=null});
render();
</script></body></html>
